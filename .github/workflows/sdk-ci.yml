name: JVM SDK CI

on:
  push:
  pull_request:

# Least privilege for a verification-only workflow: every job below only reads the checked-out
# tree, so the run's GITHUB_TOKEN is narrowed to that regardless of the repository's default
# grants. Declared at the workflow level so a job added later inherits the floor.
permissions:
  contents: read

jobs:
  # Verification only, never auto-fix: the SDK's Kotlin is generated ktfmt-clean, so a reported
  # file means either hand-edited custom code or a regenerate that was not committed. ktfmt is
  # pinned to the release that produced these bytes, since a formatter minor can change them, and
  # runs from its published jar so this job needs no Gradle plugin in the generated build. No
  # `.java` file is checked: the generated smoke tests are written already formatted, and custom
  # Java code added to the SDK goes unchecked here.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      # The generator formats with ktrs, which is held byte-identical to this ktfmt release; the real
      # jar verifies that. From the ktfmt GitHub release rather than Maven Central, which stopped
      # receiving ktfmt releases after 0.64. A release asset can be replaced after publication, so
      # the download is checked against the jar's pinned SHA-256 before it runs.
      - name: ktfmt
        run: |
          curl -fsSL -o /tmp/ktfmt.jar \
            "https://github.com/Kotlin/ktfmt/releases/download/v0.65/ktfmt-0.65-with-dependencies.jar"
          echo "aba9753b6ab387926179ab7318ba8e0c33dad483ebc72f633e79522265b15214  /tmp/ktfmt.jar" | sha256sum -c -
          find . -type f \( -name '*.kt' -o -name '*.kts' \) -print0 \
            | xargs -0 -r java -jar /tmp/ktfmt.jar --kotlinlang-style --dry-run --set-exit-if-changed

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      # `enhanced` (the default) is proprietary — free for public repos, a free preview for
      # private. `basic` is MIT `actions/cache` but keeps no restore keys: a dependency change
      # rebuilds the cache cold.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - run: ./gradlew build
